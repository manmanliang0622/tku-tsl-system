[project]
name = "signavatar"
version = "0.1.0"
description = "Taiwan Sign Language avatar animation toolchain: webcam capture to Blender playback"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[project.scripts]
signavatar = "signavatar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signavatar"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
